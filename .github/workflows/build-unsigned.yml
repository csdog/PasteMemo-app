name: Unsigned build

# Produces an installable DMG without Developer ID / notarization.
# After installing: xattr -cr /Applications/PasteMemo.app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - 'cursor/**'

permissions:
  contents: read

concurrency:
  group: unsigned-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          TAG="${TAG#v}"
          if [[ -z "$TAG" ]]; then TAG="0.0.0"; fi
          SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${TAG}-unsigned.${SHA}" >> "$GITHUB_ENV"

      - name: Package unsigned DMG
        env:
          ARCH: ${{ matrix.arch }}
        run: bash ./scripts/package.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PasteMemo-unsigned-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Install hint
        run: |
          echo "Install: open the DMG, drag PasteMemo.app to Applications, then run:"
          echo "  xattr -cr /Applications/PasteMemo.app"
